name: Ferramentas de triagem de issues para colaboradores do repositório

on:
  issue_comment:
    types: [created, edited]

jobs:
  triage-tools:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: none
      contents: none
    steps:
      - name: Processar comando de issue
        uses: actions/github-script@v9
        with:
          script: |
            const trustedUsers = [
              7896101, // RamonMods
              57459428, // FluffyPunk
              125669256, // FallenGME
              90123670, // mewclouds
              121827219, // MyDrift-user
              17331812, // Callum
              101426328, // CodingWonders
              70659536, // og-mrk
              36518683 // ANGRYxScotsman
            ];

            if (context.payload.issue.pull_request) {
              console.log("Comentários em pull requests não são suportados. Saindo.");
              return;
            }

            const comment = context.payload.comment;
            const commentAuthor = comment.user;

            if (!trustedUsers.includes(commentAuthor.id)) {
              console.log(`O autor do comentário ${commentAuthor.login} não é um usuário confiável. Saindo.`);
              return;
            }

            const {owner, repo} = context.repo;
            const issueNumber = context.issue.number;
            const command = comment.body.trim().toLowerCase();
            const triageMatch = command.match(/^\/triage$/);
            const triageOffMatch = command.match(/^\/triageoff$/);
            const notPlannedMatch = command.match(/^\/np(?:\s+(\w+))?$/);
            const duplicateMatch = command.match(/^\/duplicate\s+#?(\d+)$/);

            if (triageMatch) {
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              if (issue.data.labels.some(label => label.name === "needs-triage")) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: "Esta issue já possui o rótulo 'needs-triage'. Use /triageoff para removê-lo."
                });
              } else {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ["needs-triage"]
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `${commentAuthor.login} solicitou a triagem desta issue por um mantenedor.`
                });
              }
            } else if (triageOffMatch) {
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              if (issue.data.labels.some(label => label.name === "needs-triage")) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "needs-triage"
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `${commentAuthor.login} removeu a solicitação de triagem desta issue.`
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: "Esta issue não está marcada para triagem no momento."
                });
              }
            } else if (notPlannedMatch) {
              const reason = notPlannedMatch[1];

              if (reason === "wontfix") {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ["wontfix"]
                });
              } else if (reason === "notrelated") {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ["not-related"]
                });
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: "closed",
                state_reason: "not_planned"
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `${commentAuthor.login} fechou esta issue como não planejada.`
              });
            } else if (duplicateMatch) {
              const duplicateIssueNumber = Number(duplicateMatch[1]);

              if (!Number.isSafeInteger(duplicateIssueNumber) || duplicateIssueNumber < 1) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: "O alvo da duplicação deve ser um número de issue positivo."
                });
              } else if (duplicateIssueNumber === issueNumber) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: "Uma issue não pode ser marcada como duplicada dela mesma."
                });
              } else {
                let duplicateIssue;
                try {
                  const response = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: duplicateIssueNumber
                  });
                  duplicateIssue = response.data;
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }

                if (duplicateIssue?.pull_request) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: `#${duplicateIssueNumber} é um pull request, não uma issue.`
                  });
                } else if (duplicateIssue) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    state: "closed",
                    state_reason: "duplicate",
                    duplicate_issue_id: duplicateIssue.id
                  });
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: `${commentAuthor.login} fechou esta issue como duplicada de #${duplicateIssueNumber}.`
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: `A issue #${duplicateIssueNumber} não existe.`
                  });
                }
              }
            } else {
              console.log("O comentário não contém um comando de issue suportado. Saindo.");
              return;
            }

            await github.rest.issues.deleteComment({
              owner,
              repo,
              comment_id: comment.id
            });
