name: Pré-lançamento do WinUtil

permissions:
  contents: write
  actions: read
  pull-requests: write

on:
  workflow_dispatch: # Gatilho manual adicionado

jobs:
  build-runspace:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    env:
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Gerar documentação de dev e atualizar links JSON
        shell: pwsh
        run: |
          Set-Location tools
          ./devdocs-generator.ps1

      - name: Compilar projeto
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; ./Compile.ps1
        continue-on-error: false # Falha o job diretamente em caso de erro, eliminando a necessidade de uma verificação separada

      - name: Criar pull request para documentação e links JSON atualizados
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_MERGE }}
          commit-message: 'chore: Update generated dev docs and JSON links'
          title: 'chore: Update generated dev docs and JSON links'
          body: 'Atualização automática da documentação gerada e dos links de configuração JSON a partir do build de pré-lançamento'
          branch: docs-update
          delete-branch: true
          add-paths: |
            docs/src/content/docs/code-reference/
            config/tweaks.json
            config/feature.json
          labels: |
            automated
            documentation
            skip-changelog

      - name: Verificar saídas
        shell: bash
        run: |
          echo "Número do pull request - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "URL do pull request - ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Definir versão como a data de hoje
        id: extract_version
        run: |
          $version = (Get-Date -Format "yy.MM.dd")
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Criar tag
        id: create_tag
        run: |
          $tagExists = git tag -l $env:VERSION
          if ($tagExists -eq "") {
            git tag $env:VERSION
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha ao criar a tag $env:VERSION"
              exit 1
            }
            git push origin $env:VERSION
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha ao enviar a tag $env:VERSION"
              exit 1
            }
          } else {
            Write-Host "A tag $env:VERSION já existe; ignorando a criação da tag"
          }
        shell: pwsh

      - name: Enviar script compilado como artefato
        uses: actions/upload-artifact@v7
        with:
          name: winutil-ps1
          path: ./winutil.ps1

  release:
    needs: build-runspace
    runs-on: ubuntu-latest
    steps:
      - name: Baixar script compilado
        uses: actions/download-artifact@v8
        with:
          name: winutil-ps1

      - name: Definir versão a partir do job de compilação
        run: echo "VERSION=${{ needs.build-runspace.outputs.version }}" >> $GITHUB_ENV

      - name: Gerar notas de lançamento
        id: generate_notes
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          version: ${{ env.VERSION }}

      - name: Remover atualizações automáticas das notas de lançamento
        id: filter_notes
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.generate_notes.outputs.body }}
        run: |
          $filteredNotes = ($env:RELEASE_NOTES -split '\r?\n' | Where-Object {
            $_ -notmatch '(?i)Update (Generated Dev Docs|Sponsors)'
          }) -join "`n"

          $delimiter = [guid]::NewGuid().ToString()
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $filteredNotes >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Criar e publicar lançamento
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Pré-lançamento ${{ env.VERSION }}
          body: |
            ${{ steps.filter_notes.outputs.body }}

            ![Downloads do GitHub (asset específico, tag específica)](https://img.shields.io/github/downloads/RamonMods/winutil/${{ env.VERSION }}/winutil.ps1)
          append_body: false
          files: ./winutil.ps1
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
