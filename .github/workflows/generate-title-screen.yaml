name: Gerar tela de título do WinUtil

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winutil-title-screen
  cancel-in-progress: true

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      WINUTIL_CAPTURE_WIDTH: "1920"
      WINUTIL_CAPTURE_HEIGHT: "1080"

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: false

      - name: Definir resolução de exibição
        run: |
          # Set-DisplayResolution é fornecido pelo módulo ServerCore do
          # Windows PowerShell, por isso esta etapa chama powershell.exe a partir do pwsh de propósito.
          & powershell.exe -NoLogo -NoProfile -Command @'
          Set-DisplayResolution `
              -Width $env:WINUTIL_CAPTURE_WIDTH `
              -Height $env:WINUTIL_CAPTURE_HEIGHT `
              -Force
          '@

          if ($LASTEXITCODE -ne 0) {
              throw "Falha ao definir a resolução de exibição do runner."
          }

          Add-Type @"
          using System.Runtime.InteropServices;

          public static class ResolutionCheck {
              [DllImport("user32.dll")]
              public static extern int GetSystemMetrics(int index);
          }
          "@

          $actualWidth = [ResolutionCheck]::GetSystemMetrics(0)
          $actualHeight = [ResolutionCheck]::GetSystemMetrics(1)
          if (
              $actualWidth -ne [int]$env:WINUTIL_CAPTURE_WIDTH -or
              $actualHeight -ne [int]$env:WINUTIL_CAPTURE_HEIGHT
          ) {
              throw (
                  "O runner hospedado rejeitou a resolução solicitada. " +
                  "Solicitada: $env:WINUTIL_CAPTURE_WIDTH" +
                  "x$env:WINUTIL_CAPTURE_HEIGHT; " +
                  "real: ${actualWidth}x${actualHeight}."
              )
          }

      - name: Relatar ambiente de exibição
        run: |
          Add-Type @"
          using System.Runtime.InteropServices;

          public static class DisplayInfo {
              [DllImport("user32.dll")]
              public static extern int GetSystemMetrics(int index);
          }
          "@

          $width = [DisplayInfo]::GetSystemMetrics(0)
          $height = [DisplayInfo]::GetSystemMetrics(1)
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId

          Write-Host "Resolução: ${width}x${height}"
          Write-Host "ID da sessão: $sessionId"
          Write-Host "Usuário: $env:USERNAME"

      - name: Compilar WinUtil
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          ./Compile.ps1

      - name: Iniciar WinUtil
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "winutil.ps1"
          $command = "& '$scriptPath'"
          $bytes = [Text.Encoding]::Unicode.GetBytes($command)
          $encodedCommand = [Convert]::ToBase64String($bytes)

          # Oculta o host do console mantendo a janela WPF disponível.
          $process = Start-Process powershell.exe -ArgumentList @(
              "-NoLogo",
              "-NoProfile",
              "-ExecutionPolicy", "Bypass",
              "-EncodedCommand", $encodedCommand
          ) -WindowStyle Hidden -PassThru

          "WINUTIL_HOST_PID=$($process.Id)" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $deadline = (Get-Date).AddSeconds(90)
          do {
              Start-Sleep -Seconds 2
              # Um título com versão exclui o host do console sem versão.
              $window = Get-Process |
                  Where-Object { $_.MainWindowTitle -match '^WinUtil\s+\d' } |
                  Select-Object -First 1
          } until ($window -or (Get-Date) -ge $deadline)

          if (-not $window) {
              throw "O WinUtil não exibiu uma janela em até 90 segundos."
          }

          Write-Host "HWND do WinUtil: $($window.MainWindowHandle)"
          Write-Host "Título do WinUtil: $($window.MainWindowTitle)"

          # O HWND exato evita ambiguidade na enumeração da área de trabalho. O Python valida
          # o título e a classe WPF antes de usá-lo.
          "WINUTIL_HWND=$($window.MainWindowHandle)" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Gerar tela de título
        working-directory: tools/title-screen
        run: |
          & uv run --locked python automate_title_screen.py `
              --output ..\..\docs\src\assets\branding\title-screen.png 2>&1 |
              Tee-Object -FilePath "$env:RUNNER_TEMP\title-screen-capture.log"

          if ($LASTEXITCODE -ne 0) {
              throw "A automação da tela de título terminou com o código $LASTEXITCODE."
          }

      - name: Criar pull request de atualização da tela de título
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_MERGE }}
          add-paths: docs/src/assets/branding/title-screen.png
          base: main
          branch: title-screen-update
          delete-branch: true
          commit-message: "docs: atualizar tela de título do WinUtil"
          title: "docs: atualizar tela de título do WinUtil"
          body: |
            Regera a composição da tela de título do WinUtil nas versões clara e escura a partir da branch main atual.

            Fluxo de trabalho de origem: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            automated
            documentation
            skip-changelog

      - name: Relatar pull request
        if: steps.cpr.outputs.pull-request-url
        env:
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          Write-Host "Pull request $env:PR_OPERATION`: $env:PR_URL"

      - name: Inspecionar UI Automation em caso de falha
        if: failure()
        continue-on-error: true
        working-directory: tools/title-screen
        run: |
          uv run --locked python inspect_winutil.py `
              "$env:RUNNER_TEMP\winutil-title-screen-inspect.txt"

      - name: Enviar diagnósticos de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: winutil-title-screen-failure-${{ github.run_number }}
          path: |
            docs/src/assets/branding/title-screen.png
            ${{ runner.temp }}/title-screen-capture.log
            ${{ runner.temp }}/winutil-title-screen-inspect.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fechar WinUtil
        if: always()
        run: |
          if ($env:WINUTIL_HOST_PID) {
              Stop-Process `
                  -Id ([int]$env:WINUTIL_HOST_PID) `
                  -Force `
                  -ErrorAction SilentlyContinue
          }
