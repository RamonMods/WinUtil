name: Rotular PRs por tipo de alteração

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  label-pr:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'docs-update'
    runs-on: ubuntu-latest
    concurrency:
      group: label-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      issues: write
      contents: read  # Geralmente necessário para o github-script
    steps:
      - name: Verificar o título do PR quanto ao tipo de alteração
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const title = pr.title || '';
            const labelsByTag = {
              'feat': 'new feature',
              'fix': 'bug',
              'chore': 'chore',
              'docs': 'documentation',
              'ui-ux': 'ui update'
            };

            // Formato de título do modelo de PR: "tag(seção): descrição" ou "docs: descrição"
            const match = title.match(/^\s*(feat|fix|chore|docs|ui-ux)(?:\([^)]*\))?:/i);
            const typeLabel = match && labelsByTag[match[1].toLowerCase()];
            const managedLabels = Object.values(labelsByTag);

            for (const label of pr.labels) {
              if (managedLabels.includes(label.name) && label.name !== typeLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label.name
                });
              }
            }

            if (typeLabel && !pr.labels.some(label => label.name === typeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [typeLabel]
              });
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const codePaths = ['functions/', 'scripts/', 'config/', 'xaml/'];
            const codeFiles = ['Compile.ps1', 'tools/autounattend.xml'];
            const hasCodeChanges = files.some(file =>
              [file.filename, file.previous_filename].some(path =>
                path && (codeFiles.includes(path) || codePaths.some(prefix => path.startsWith(prefix)))
              )
            );
            const hasSkipChangelog = pr.labels.some(
              label => label.name === 'skip-changelog'
            );

            if (hasCodeChanges && hasSkipChangelog) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'skip-changelog'
              });
            } else if (!hasCodeChanges && !hasSkipChangelog) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['skip-changelog']
              });
            }
