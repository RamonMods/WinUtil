name: Fechar issues inativas

on:
  schedule:
    - cron: '0 0 * * *'  # Executar diariamente
  workflow_dispatch:  # Esta linha habilita o gatilho manual

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # Garante as permissões necessárias para issues
      pull-requests: none
      contents: none
    steps:
    - name: Fechar issues inativas
      uses: actions/stale@v10
      with:
        # Uma lista de rótulos a serem considerados ao examinar as issues:
        # somente quando um (ou mais) desses rótulos for encontrado,
        # a issue é ignorada, nunca sendo marcada como inativa e/ou fechada.
        exempt-issue-labels: "Keep Issue Open"
        # O prazo é dividido em duas semanas: após uma semana, a issue é marcada como inativa;
        # após outra semana sem nenhuma atualização, a issue é então fechada.
        days-before-issue-stale: 90
        days-before-issue-close: 365
        # NUNCA marcar PRs como inativos nem fechá-los + este fluxo nunca deve ter permissão de escrita em PRs, NUNCA!
        days-before-pr-stale: -1
        days-before-pr-close: -1
        # Envia uma mensagem tanto para o evento de inatividade quanto para o de fechamento de uma issue.
        stale-issue-message: "Esta issue foi marcada como inativa devido à falta de atividade."
        close-issue-message: "Esta issue foi fechada após permanecer inativa sem atualizações."
        # Aumente este valor se o projeto receber muitos
        # PRs (sim.. aparentemente eles são processados de qualquer forma) e issues.
        # O valor padrão (segundo a documentação) é 30
        operations-per-run: 200
        # Defina este campo como true se quiser testar se a configuração funciona corretamente
        debug-only: false
        repo-token: ${{ secrets.GITHUB_TOKEN }}
