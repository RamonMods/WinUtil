name: Gerar README de patrocinadores
on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 * * 0-6
permissions:
  contents: write
  pull-requests: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.repository == 'RamonMods/winutil') || (github.event_name != 'schedule')
    steps:
      - name: Checkout do repositório 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Gerar patrocinadores 💖
        uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.PAT }}
          file: 'README.md'

      - name: Criar pull request 🚀
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_MERGE }}
          commit-message: 'Update sponsors in README'
          title: 'chore: Update Sponsors README'
          body: 'Atualização automática da seção de patrocinadores'
          branch: sponsors-update
          delete-branch: true
          labels: |
            automated
            skip-changelog

      - name: Verificar saídas
        run: |
          echo "Número do pull request - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "URL do pull request - ${{ steps.cpr.outputs.pull-request-url }}"
