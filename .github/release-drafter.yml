tag-prefix: ''
categories:
  - title: 'Recursos'
    labels:
      - 'feature'
      - 'enhancement'
      - 'new feature'
  - title: 'Correções de bugs'
    labels:
      - 'hotfix'
      - 'bugfix'
      - 'bug'
  - title: 'Melhorias de UI/UX'
    labels:
      - 'ui update'
      - 'ui-ux'
  - title: 'Limpeza de código'
    label: 'chore'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## Mudanças

  $CHANGES

change-title-escapes: '\<*_&"'''
autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
    branch:
      - '/docs{0,1}\/.+/'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: 'new feature'
    branch:
      - '/feature\/.+/'
    body:
      - '/[A-Z]+-[0-9]+/'
  - label: 'documentation'
    files:
      - '**/*.md'
      - 'docs/**/*'
replacers:
  - search: /"/g
    replace: ''
  - search: /'/g
    replace: ''
exclude-labels:
  - 'skip-changelog'
  - 'automated'

filter-by-commitish: true
