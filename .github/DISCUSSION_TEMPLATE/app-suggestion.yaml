title: "[Sugestão de aplicativo] "
body:
  - type: input
    attributes:
      label: "Link do aplicativo"
      description: "Forneça um link onde este aplicativo pode ser baixado oficialmente"
  - type: checkboxes
    attributes:
      label: "Lista de regras"
      description: "Você deve concordar com as seguintes regras"
      options:
        - label: "Este aplicativo é popular o suficiente, portanto não é considerado de nicho"
          required: true
        - label: "Este aplicativo não é considerado bloatware"
          required: true
        - label: "Este aplicativo é gratuito para acessar"
          required: true
        - label: "Este aplicativo deve ser incluído na maioria dos sistemas recém-instalados"
          required: true
        - label: "Este aplicativo está presente no WinGet (verifique winstall.app ou execute 'winget search your-app' no terminal)"
          required: true
  - type: checkboxes
    attributes:
      label: "Verifique aplicativos recusados"
      options:
        - label: "Sim, verifiquei PRs, issues e discussões por sugestões existentes e seus resultados"
          required: true
      
