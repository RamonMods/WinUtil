name: "Solicitação de recurso"
description: "Sugira um novo recurso ou melhoria para o projeto."
title: "[Solicitação de Recurso] - <seu resumo aqui>"
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        # ✨ **Solicitação de recurso**
        Obrigado por dedicar seu tempo para sugerir um recurso! Forneça o máximo de detalhes possível para nos ajudar a entender e avaliar sua solicitação.

        ## ⚠️ **IMPORTANTE**
        - 🛠️ **Apenas ambientes suportados:** Só damos suporte ao Windows 11.
        - 💡 Para dúvidas gerais, use a [seção Discussões](https://github.com/RamonMods/WinUtil/discussions) ou entre no nosso [Servidor Discord](https://github.com/RamonMods/WinUtil) mantido pela comunidade.

  - type: textarea
    id: proposed_solution
    attributes:
      label: 💡 Descreva a solução que você gostaria
      placeholder: "Forneça uma descrição clara e concisa."
    validations:
      required: true
