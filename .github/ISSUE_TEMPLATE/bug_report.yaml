name: "Relatório de bug"
description: "Relate um bug para nos ajudar a identificar e corrigir problemas no projeto."
title: "[Relatório de Bug] - <seu resumo aqui>"
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        - Lembre-se: só damos suporte ao Windows 11. Se encontrar problemas no Windows 10, considere atualizar para o Windows 11.
        - Para dúvidas gerais, use a aba [Discussions](https://github.com/RamonMods/WinUtil/discussions).
        - Para problemas relacionados ao WinOneShot, use o [repositório respectivo](https://github.com/CT-Tech-Group/winoneshot/issues).

  - type: checkboxes
    id: read_issues
    attributes:
      label: "Li os problemas conhecidos"
      description: "Você [deveria](https://github.com/RamonMods/WinUtil/knownissues/), pois o seu problema pode já estar lá"
      options:
        - label: Sim, li
          required: true

  - type: input
    id: winutil_version
    attributes:
      label: "Versão do WinUtil"
      description: "Informe a versão que você está usando ao enviar o problema (ela pode ser vista no canto direito do aplicativo)"
    validations:
      required: true

  - type: dropdown
    id: affected_part
    attributes:
      label: Em qual parte do WinUtil você está com problemas?
      options:
        - Aba Instalar
        - Aba Ajustes
        - Aba Configurações
        - Aba Atualizações
        - Aba Criador do Win11
    validations:
      required: false

  - type: textarea
    id: issue_description
    attributes:
      label: "Descrição do problema"
      description: Forneça uma descrição clara e concisa do problema.
    validations:
      required: true

  - type: textarea
    id: tweaks_applied
    attributes:
      label: "Lista de ajustes aplicados"
      description: Liste os ajustes que você aplicou antes de o problema ocorrer.
    validations:
      required: false

  - type: textarea
    id: error_output
    attributes:
      label: Logs de erro
      description: "Cole a saída completa do erro (se disponível) ou substitua o texto preenchido por uma captura de tela ou clipe de vídeo."
      placeholder: "Inclua quaisquer logs ou mensagens de erro relevantes. Não inclua informações sensíveis no log apresentado"
      value: |
        <details>
        <summary>Clique para expandir</summary>
        <!--Coloque seu log abaixo desta tag-->

        </details>
